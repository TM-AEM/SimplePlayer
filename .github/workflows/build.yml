name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (Build Type)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore for Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          elif [ -f "upload-keystore.jks" ]; then
            echo "Using existing upload-keystore.jks in repository."
          else
            echo "Generating temporary signing key for release build..."
            keytool -genkeypair -v -keystore upload-keystore.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass simpleplayer123 -keypass simpleplayer123 \
              -dname "CN=SimplePlayer, OU=Mobile, O=SimplePlayerApp, L=Riyadh, ST=Riyadh, C=SA"
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'simpleplayer123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'simpleplayer123' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Organize Artifacts
        run: |
          mkdir -p output-apks
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk output-apks/SimplePlayer-v1.0.0-release.apk
            echo "Release APK copied."
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output-apks/SimplePlayer-v1.0.0-debug.apk
            echo "Debug APK copied."
          fi

      - name: Upload APKs as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimplePlayer-APKs
          path: output-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
